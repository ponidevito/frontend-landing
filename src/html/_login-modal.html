<!-- Login Modal -->
<div class="login-modal" id="login-modal">

    <div class="login-modal__overlay"></div>

    <div class="login-modal__body">

        <button class="login-modal__close" type="button" aria-label="Close modal">
            ×
        </button>

        <div class="login-modal__content">

            <div class="login-modal__form-wrapper">

                <h3 class="login-modal__subtitle">
                    Login
                </h3>

                <form class="login-form">

                    <div class="login-form__field">
                        <input class="login-form__input" type="email" placeholder="Email Address">
                    </div>

                    <div class="login-form__field">
                        <input class="login-form__input" type="password" placeholder="Password">
                    </div>

                    <button class="login-form__btn btn" type="submit">
                        Sign In
                    </button>

                    <div class="login-form__bottom">

                        <label class="login-form__remember">
                            <input type="checkbox">
                            <span>Remember me</span>
                        </label>

                        <a href="#" class="login-form__link">
                            Forgot password?
                        </a>

                    </div>

                    <p class="login-form__note">
                        Demo login only. No real authentication is used.
                    </p>

                </form>

            </div>

        </div>

    </div>

</div>
